  - id: gore_piura_hydromet
    name: Datos Hidrometeorológicos [Gobierno Regional Piura]
    publisher: Gobierno Regional de Piura - Proyecto Especial Chira Piura
    page: https://www.datosabiertos.gob.pe/dataset/datos-hidrometereol%C3%B3gicos-gobierno-regional-piura
    role: clima (lluvia diaria en Piura)
    temporal_coverage: 2022-01-01 a 2026-08-31, diario
    spatial_coverage: Piura, 29 puntos de medición en presas, ríos y canales
    join_key: UBIGEO + FECHA_REGISTRO
    retrieved_on: 2026-10-28
    notes:
      - Solo ~13 de los 29 puntos miden lluvia (PRECIP24H); los demás (canales, volúmenes, evaporación) siempre marcan 0 y hay que excluirlos.
      - Faltan ~23 días por año.
      - La fuente sobrescribe este archivo cada mes en la misma URL; el sha256 identifica la versión usada.
    files:
      - path: data/raw/gore_piura/piura_hydromet.csv
        url: https://www.datosabiertos.gob.pe/sites/default/files/tb_medida_estaciones_act.csv
