  - id: senamhi_stations
    name: Datos diarios de estaciones meteorológicas convencionales
    publisher: Servicio Nacional de Meteorología e Hidrología del Perú (SENAMHI)
    page: https://observatorio.senamhi.gob.pe/investigadores/interoperabilidad
    role: clima (validación de gore_piura_hydromet en Piura; lluvia, temperatura y humedad en Tumbes y la selva)
    temporal_coverage: 2022-01 a 2025-12, diario, según los meses que publique cada estación
    spatial_coverage: 9 estaciones cercanas a ciudades con dengue
    join_key: ubigeo de la estación + fecha
    retrieved_on: 2026-10-30
    source: senamhi_api
    api:
      base_url: https://interoperabilidad.senamhi.gob.pe/api
      key_env_var: SENAMHI_API_KEY
      requests_per_minute: 20
    period:
      start: "2022-01"
      end: "2025-12"
    output_dir: data/raw/senamhi
    notes:
      - Requiere una cuenta aprobada por el SENAMHI; la API key va en .env y la IP pública de origen debe estar registrada en la cuenta.
      - Se guarda cada respuesta JSON tal cual en {code}/station.json, {code}/periods.json y {code}/{AAAAMM}.json.
      - Las estaciones convencionales devuelven una fila por día; los valores inválidos llegan como null y la traza de lluvia como "T".
      - Datos sin control de calidad.
    stations:
      - code: "105100"
        name: MIRAFLORES
        district: CASTILLA (Piura)
        ubigeo: "200104"
        purpose: validación de gore_piura_hydromet
      - code: "104079"
        name: MALLARES
        district: MARCAVELICA (Sullana, Piura)
        ubigeo: "200605"
        purpose: validación de gore_piura_hydromet
      - code: "103038"
        name: PUERTO PIZARRO
        district: TUMBES
        ubigeo: "240101"
        purpose: costa
      - code: "100138"
        name: TARAPOTO
        district: TARAPOTO (San Martín)
        ubigeo: "220901"
        purpose: selva
      - code: "106014"
        name: MOYOBAMBA
        district: MOYOBAMBA (San Martín)
        ubigeo: "220101"
        purpose: selva
      - code: "103057"
        name: AMAZONAS
        district: IQUITOS (Loreto)
        ubigeo: "160101"
        purpose: selva
      - code: "100132"
        name: SHANUSI
        district: YURIMAGUAS (Loreto)
        ubigeo: "160201"
        purpose: selva
      - code: "108021"
        name: PUCALLPA
        district: CALLERIA (Ucayali)
        ubigeo: "250101"
        purpose: selva
      - code: "100109"
        name: PUERTO MALDONADO
        district: TAMBOPATA (Madre de Dios)
        ubigeo: "170101"
