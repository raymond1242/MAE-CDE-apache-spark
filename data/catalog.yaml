  - id: sunass_water_emergencies
    name: Distritos declarados en estado de emergencia por riesgos asociados a recursos hídricos
    publisher: Superintendencia Nacional de Servicios de Saneamiento (SUNASS)
    page: https://www.datosabiertos.gob.pe/dataset/distritos-declarados-en-estado-de-emergencia-por-riesgos-asociados-recursos-h%C3%ADdricos-sunass
    role: dimensión (emergencias por lluvias o déficit hídrico, cobertura y continuidad del agua)
    temporal_coverage: decretos de 2017, 2023 y 2024
    spatial_coverage: 1,772 distritos (546 de los 662 con dengue)
    join_key: UBIGEO + ANIO (y FECHA_INICIO/FECHA_FINAL para cruces por rango)
    retrieved_on: 2026-10-28
    notes:
      - Un distrito aparece varias veces por prórrogas; hay que agregar antes de unir para no duplicar casos.
      - COB_AGUA = % de cobertura de agua; CONT_HD = horas de agua al día.
