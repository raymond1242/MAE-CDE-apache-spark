# Data catalog: single source of truth for what data the project uses and where it comes from.
#
# - Each dataset groups one or more files (its parts). Each file records its source URL,
#   its local path, its format and its sha256.
# - The sha256 pins the exact version used: if the source publishes a new version,
#   scripts/download_data.py reports it.
# - Nothing under data/raw/ is committed; run `python scripts/download_data.py` to rebuild it.
# - senamhi_stations is fetched from the SENAMHI interoperability API (needs SENAMHI_API_KEY in .env).
# - The `relations` section (at the end) describes how datasets are joined.
# - Keys are in English; descriptive values are in Spanish.

datasets:

  - id: dengue
    name: Vigilancia epidemiológica de dengue
    publisher: Centro Nacional de Epidemiología, Prevención y Control de Enfermedades (CDC Perú) - MINSA
    page: https://www.datosabiertos.gob.pe/dataset/vigilancia-epidemiol%C3%B3gica-de-dengue
    role: hechos (tabla principal, una fila por caso notificado)
    temporal_coverage: 2000-2025, por año y semana epidemiológica
    spatial_coverage: Perú, 662 distritos con casos
    join_key: ubigeo (6 dígitos) + ano + semana
    retrieved_on: 2026-10-28
    notes:
      - 1,065,274 casos. enfermedad/diagnostic indica gravedad (A97.0 sin signos de alarma, A97.1 con signos, A97.2 grave).
      - "tipo_dx: C confirmado, P probable."
      - edad viene en años, meses o días según tipo_edad (A/M/D); hay que normalizarla.
      - Hay comas dentro de campos entre comillas.
    files:
      - path: data/raw/dengue/dengue_surveillance_2000_2025.csv
        url: https://www.datosabiertos.gob.pe/sites/default/files/datos_abiertos_vigilancia_dengue_2000_2025_0.csv
        kind: data
        format: csv
        delimiter: ","
        encoding: utf-8
        sha256: 7865e8b2f5a7aef1e8dce159444891f2c2e59b311d574f28c55aaca5a9abb8ba
        bytes: 117866478

