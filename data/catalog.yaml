relations:
  - datasets: [dengue, reniec_population]
    join_key: dengue.ubigeo = reniec_population.UBIGEO_INEI (+ año del corte)
    purpose: casos por 100 mil habitantes, por distrito, sexo y grupo de edad
  - datasets: [dengue, sunass_water_emergencies]
    join_key: dengue.ubigeo = sunass.UBIGEO, y fecha del caso dentro de [FECHA_INICIO, FECHA_FINAL]
    purpose: incidencia en distritos en emergencia frente a distritos sin emergencia; efecto de horas de agua al día
  - datasets: [dengue, renipress_facilities]
    join_key: dengue.ubigeo = renipress.UBIGEO
    purpose: establecimientos de salud por habitante frente a casos graves o sin confirmar
  - datasets: [dengue, gore_piura_hydromet]
    join_key: ubigeo o provincia + semana epidemiológica (la lluvia diaria se agrega a semanas)
    purpose: semanas de retraso entre lluvia y aumento de casos en Piura
  - datasets: [dengue, senamhi_stations]
    join_key: ubigeo o provincia de la estación + semana epidemiológica
    purpose: relación entre lluvia, temperatura y casos en la costa y la selva
  - datasets: [gore_piura_hydromet, senamhi_stations]
    join_key: distrito + fecha
    purpose: validar la lluvia del Gobierno Regional de Piura con estaciones oficiales del SENAMHI
